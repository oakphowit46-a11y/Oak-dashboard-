<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ตารางสอนร้องเพลง</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#f2f4f7;--card:#fff;--tx:#18222d;--mut:#5b6877;--ac:#1f3a5f;--acx:#fff;--bd:#d6dde5;--side:#13263d;--ok:#15803d;--bad:#b91c1c;--school:#1d4ed8;--home:#b45309;--online:#0f766e;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e151d;--card:#16202b;--tx:#e5ebf1;--mut:#90a0b0;--ac:#7db0e6;--acx:#0e151d;--bd:#2a3744;--side:#0a1018;--ok:#4ade80;--bad:#f87171;--school:#7aa2ff;--home:#fbbf24;--online:#2dd4bf;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e151d;--card:#16202b;--tx:#e5ebf1;--mut:#90a0b0;--ac:#7db0e6;--acx:#0e151d;--bd:#2a3744;--side:#0a1018;--ok:#4ade80;--bad:#f87171;--school:#7aa2ff;--home:#fbbf24;--online:#2dd4bf;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 'IBM Plex Sans Thai',Sarabun,system-ui,sans-serif}
main{max-width:1180px;margin:0 auto;padding:14px 18px 40px}
h1{font-size:20px;margin:6px 0 10px}h2{font-size:17px;margin:18px 0 8px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;padding:9px 2px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font:inherit;font-size:14px}
.tabs button.on{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:700}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:11px 13px;margin:8px 0;border-left:5px solid var(--bd)}
.card.school{border-left-color:var(--school)}.card.home{border-left-color:var(--home)}.card.online{border-left-color:var(--online)}
.card.absent,.card.cancel{opacity:.6}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.nm{font-weight:700;font-size:17px}.nm small{font-weight:400;color:var(--mut);font-size:14px}
.b{font-size:12px;padding:2px 9px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.b.school{color:var(--school)}.b.home{color:var(--home)}.b.online{color:var(--online)}
.mut{color:var(--mut);font-size:14px}
button,input,select,textarea{font:inherit;color:var(--tx)}
.btn{padding:7px 12px;border-radius:9px;border:1px solid var(--bd);background:var(--card);cursor:pointer}
.btn.pri{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:700}
.btn.ok.on{background:var(--ok);color:#fff;border-color:var(--ok)}.btn.bad.on{background:var(--bad);color:#fff;border-color:var(--bad)}.btn.gr.on{background:var(--mut);color:var(--bg)}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--bd);border-radius:9px;background:var(--bg)}
textarea{min-height:56px;margin-top:8px;resize:vertical}
label{display:block;font-size:13px;color:var(--mut);margin:9px 0 3px}		
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat div{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:22px;color:var(--ac)}.stat span{font-size:13px;color:var(--mut)}
.chart{display:flex;align-items:flex-end;gap:4px;height:150px;margin-top:10px}
.chart i{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-style:normal;font-size:10px;color:var(--mut)}
.chart u{display:block;width:100%;background:var(--ac);border-radius:4px 4px 0 0;text-decoration:none;min-height:2px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}.tbl td,.tbl th{padding:6px 4px;border-bottom:1px solid var(--bd);text-align:right}.tbl td:first-child,.tbl th:first-child{text-align:left}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sheet{background:var(--bg);width:100%;max-width:680px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding:14px 14px calc(18px + env(safe-area-inset-bottom,0px))}
.wd{display:flex;justify-content:space-between;align-items:center;margin-top:14px}.wd b.t{color:var(--ac)}
.seg{display:flex;gap:6px;margin:8px 0}.seg button{flex:1}
.empty{padding:22px;text-align:center;color:var(--mut)}
.shell{display:grid;grid-template-columns:190px 1fr;gap:22px;align-items:start}aside{position:sticky;top:14px}
.tabs{flex-direction:column}.tabs button{flex:none;text-align:left;padding:10px 14px}
@media(max-width:820px){.shell{grid-template-columns:1fr}aside{position:static}.tabs{flex-direction:row;flex-wrap:wrap}.tabs button{flex:1;text-align:center;padding:9px 4px}.split{grid-template-columns:1fr!important}}
@media(min-width:821px){.ov{align-items:center}.sheet{border-radius:16px}}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal>div{min-height:96px;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:4px;overflow:hidden;cursor:pointer}.cal .h{min-height:0;text-align:center;background:none;border:0;color:var(--mut);cursor:default}
.cal .d{font-size:12px;color:var(--mut)}.cal .tdy{border:2px solid var(--ac)}.cal .o{opacity:.45}
.ev{font-size:11px;border-radius:4px;padding:1px 4px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--acx)}.ev.school{background:var(--school)}.ev.home{background:var(--home)}.ev.online{background:var(--online)}
.split{display:grid;grid-template-columns:230px 1fr;gap:18px}
.ph{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.ph img{width:84px;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--bd);cursor:pointer}
.card,.stat div,.sheet,.cal>div,.ph img,.ev{border-radius:5px}.btn,input,select,textarea{border-radius:4px}
aside{background:var(--side);border-radius:8px;padding:18px 14px}aside h1{color:#fff;font-size:16px;line-height:1.35;margin:0 0 16px;padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,.15)}
.tabs button{background:transparent;color:#cfdbe8;border-color:transparent;border-radius:5px}.tabs button.on{background:rgba(255,255,255,.16);color:#fff;font-weight:600}
.rwrap{overflow-x:auto;border:1px solid var(--bd);border-radius:6px;margin-top:12px;background:#fff}
.rpt{background:#fff;color:#111;padding:28px;font-size:13px;width:794px}.rpt h2{font-size:20px;margin:0 0 4px;color:#13263d}.rpt h3{font-size:15px;margin:18px 0 6px;color:#13263d}.rpt .rm{color:#555;font-size:12px}
.rpt .rs{display:flex;gap:28px;margin:14px 0;padding:10px 12px;background:#eef2f7}.rpt .rs b{display:block;font-size:17px}.rpt table{width:100%;border-collapse:collapse}.rpt th{background:#13263d;color:#fff;text-align:left;padding:5px 6px;font-weight:600}.rpt td{padding:5px 6px;border-bottom:1px solid #d6dde5;vertical-align:top}.rpt .nt td{color:#444;font-size:12px}
.slip .sh{display:flex;justify-content:space-between;align-items:flex-end;background:#13263d;color:#fff;margin:-28px -28px 16px;padding:22px 28px}.slip .st1{font-size:22px;font-weight:700}.slip .st2{font-size:12px;opacity:.8}.slip .sr{text-align:right;font-size:13px}
.slip .sg{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:12px 0}.slip .sg label,.slip .net label{display:block;font-size:11px;color:#667;margin:0}.slip .sg b{font-size:14px}
.slip .n{text-align:right}.slip .tt td{font-weight:700;background:#eef2f7}
.slip .net{margin:14px 0;padding:14px 16px;border:2px solid #13263d;display:flex;justify-content:space-between;align-items:center;gap:16px}.slip .net b{font-size:26px;color:#13263d}.slip .bt{font-size:13px;color:#333;text-align:right}
.slip .sig{align-self:end;text-align:center;font-size:12px;margin-top:30px}.slip .fn{margin-top:16px;font-size:11px;color:#667}
.slip{border:1px solid #888}.slip .ti{text-align:center;border-bottom:3px double #13263d;padding-bottom:10px;margin-bottom:12px}.slip .t1{font-size:22px;font-weight:700;color:#13263d}.slip .t2{font-size:12px;color:#555;letter-spacing:.5px}
.slip .meta{display:flex;justify-content:space-between;font-size:12px;margin-bottom:8px}.slip .bx{border:1px solid #444;padding:8px 12px;margin:8px 0;line-height:1.75}.slip .bx b{display:inline-block;min-width:150px;font-weight:600}
.slip table{border:1px solid #444;margin-top:8px}.slip th{background:#e6ebf1;color:#111;border:1px solid #444;text-align:center}.slip td{border:1px solid #888}.slip .n{text-align:right}.slip .c{text-align:center}.slip .tt td{font-weight:700;background:#f1f4f8}
.slip .net{margin:10px 0;padding:10px 14px;border:2px solid #13263d;display:flex;justify-content:space-between;align-items:center;gap:14px}.slip .net b{font-size:22px;color:#13263d}.slip .bt{font-size:13px;text-align:right}
.slip .sigs{display:flex;justify-content:space-between;align-items:flex-end;margin-top:12px;font-size:13px;line-height:1.8}.slip .sigs>div:last-child{text-align:center;margin-top:26px}.slip .fn{margin-top:14px;font-size:11px;color:#555;border-top:1px solid #aaa;padding-top:6px}
#boot{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;align-items:center;justify-content:center;color:var(--mut)}#boot[hidden]{display:none}
#bn{background:#fde8e8;color:#8a1c1c;border:1px solid #f0b4b4;padding:10px 12px;border-radius:6px;margin-bottom:10px;font-size:14px}#bn[hidden]{display:none}
.ai{white-space:pre-wrap;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-top:12px}
</style></head><body><main>
<div id="boot">กำลังโหลดข้อมูล…</div><div class="shell"><aside><h1>ระบบบริหารงานสอนร้องเพลง</h1>
<div class="tabs" id="tabs"></div><div id="stat" style="margin-top:14px;font-size:12px;color:#9fb2c8">กำลังเชื่อมต่อระบบ…</div></aside><div><div id="bn" hidden></div><div id="app"></div></div></div></main><div id="modal2"></div><div id="modal"></div>
<script>
const K='singteach.v1',TL={school:'โรงเรียน',home:'รับเอง',online:'ออนไลน์'},ST={planned:'นัดไว้',done:'มาเรียน',absent:'ขาด',cancel:'ยกเลิก'};
const MN=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const def=()=>({students:[],subjects:['ร้องเพลงป๊อป','เทคนิคการหายใจ','ทฤษฎีดนตรี','เตรียมออดิชั่น'].map((name,i)=>({id:'s'+i,name})),places:[{id:'p1',name:'สตูดิโอที่บ้าน',type:'home',rate:0},{id:'p2',name:'ออนไลน์ (Zoom)',type:'online',rate:0},{id:'p3',name:'โรงเรียน (แก้ชื่อได้)',type:'school',rate:0}],lessons:[]});
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}if(!S)S=def();S.pay=S.pay||{};
const isPaid=l=>!!S.pay[l.date.slice(0,7)+'|'+l.placeId];
function settle(){const m={};S.lessons.filter(l=>l.status=='done').forEach(l=>{const k=l.date.slice(0,7)+'|'+l.placeId,r=m[k]=m[k]||{h:0,a:0};r.h+=l.hours;r.a+=inc(l)});const ks=Object.keys(m).sort().reverse().slice(0,36);
return `<h2>ปิดยอดรายเดือน (โรงเรียนจ่ายจากชั่วโมงสะสมทุกสิ้นเดือน)</h2><table class="tbl"><tr><th>เดือน · สถานที่</th><th>ชม.</th><th>ยอด</th><th>สถานะ</th></tr>${ks.map(k=>{const[mo,p]=k.split('|'),pl=find('places',p),[y,n]=mo.split('-');return `<tr><td>${MN[n-1]} ${+y+543} · ${pl?esc(pl.name):'—'}</td><td>${m[k].h}</td><td>${money(m[k].a)}</td><td><button class="btn ${S.pay[k]?'ok on':''}" data-a="pay" data-v="${k}">${S.pay[k]?'จ่ายแล้ว':'รอจ่าย'}</button></td></tr>`}).join('')||'<tr><td class="mut">ยังไม่มีคาบที่เช็คชื่อ</td><td></td><td></td><td></td></tr>'}</table>`}
let DBH=null,dirty=false,SV={},Q=Promise.resolve();const setStat=t=>{const e=document.querySelector('#stat');if(e)e.textContent=t;const b=document.querySelector('#bn');if(b){const bad=/ไม่|ล้มเหลว/.test(t);b.hidden=!bad;b.textContent=bad?'⚠ '+t+' — ข้อมูลที่กรอกอาจไม่ถูกเก็บถาวร':''}};
function persist(){if(!DBH){setStat('ยังเชื่อมต่อระบบบันทึกไม่ได้');return}clearTimeout(persist.t);setStat('กำลังบันทึก…');persist.t=setTimeout(()=>{Q=Q.then(async()=>{try{const docs={core:{pay:S.pay,prof:S.prof||{}}},by={};S.students.forEach(x=>docs['u'+x.id]=x);S.subjects.forEach(x=>docs['b'+x.id]=x);S.places.forEach(x=>docs['p'+x.id]=x);
S.lessons.forEach(l=>(by[l.date.slice(0,7)]=by[l.date.slice(0,7)]||[]).push(l));for(const m in by)docs['m'+m]={lessons:by[m]};
for(const k in SV)if(!(k in docs))docs[k]=/^m/.test(k)?{lessons:[]}:null;
for(const k of Object.keys(docs).sort((a,b)=>(a=='core')-(b=='core'))){const j=JSON.stringify(docs[k]);if(SV[k]!==j){const r=DBH.collection('app').doc(k);if(docs[k]===null){await r.delete();delete SV[k]}else{await r.set(JSON.parse(j));SV[k]=j}}}
setStat('✓ บันทึกแล้ว')}catch(e){setStat('บันทึกไม่สำเร็จ: '+((e&&e.message)||'ลองใหม่'))}})},700)}
const bootOff=()=>{const b=document.querySelector('#boot');if(b)b.hidden=true};setTimeout(bootOff,10000);
async function dbLoad(){try{const db=await claude.use('db');if(!db)throw {message:'ระบบบันทึกไม่พร้อมใช้งานบนหน้านี้'};const sn=await db.collection('app').get();
if(!sn.empty){const T={students:[],subjects:[],places:[],pay:{},lessons:[]},add=(k,x)=>{if(x&&x.id&&!T[k].some(y=>y.id==x.id))T[k].push(x)};
sn.docs.forEach(d=>{const x=d.data()||{};SV[d.id]=JSON.stringify(x);const c=d.id[0];
if(d.id=='core'){T.pay=x.pay||{};T.prof=x.prof||{};['students','subjects','places'].forEach(k=>(x[k]||[]).forEach(y=>add(k,y)))}
else if(c=='u')add('students',x);else if(c=='b')add('subjects',x);else if(c=='p')add('places',x);else if(c=='m')T.lessons.push(...(x.lessons||[]))});
if(dirty)['students','subjects','places','lessons'].forEach(k=>S[k].forEach(x=>{if(!/^(s[0-3]|p[1-3])$/.test(x.id)&&!T[k].some(y=>y.id==x.id))T[k].push(x)}));
['students','subjects','places'].forEach(k=>T[k].sort((a,b)=>String(a.name).localeCompare(String(b.name),'th')));S=T;S.pay=S.pay||{}}
DBH=db;if(sn.empty||dirty)persist();else setStat('✓ ซิงก์แล้ว');dirty=false;R()}catch(e){setStat('เชื่อมต่อระบบไม่ได้ ('+((e&&e.message)||'ไม่ทราบสาเหตุ')+') จะบันทึกในเครื่องนี้เท่านั้น')}finally{bootOff();if(!DBH)setTimeout(dbLoad,6000)}}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}if(!DBH)dirty=true;persist()};
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const pd=s=>{const[a,b,c]=s.split('-');return new Date(+a,b-1,+c)};
const addD=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const wk=d=>addD(d,-((d.getDay()+6)%7));
const money=n=>Math.round(n).toLocaleString('th-TH')+' ฿';
const th=(d,o)=>d.toLocaleDateString('th-TH',o);
const inc=l=>l.hours*l.rate;
const find=(k,id)=>S[k].find(x=>x.id==id);
let tab='today',wo=0,mode='month',yr=new Date().getFullYear(),tmp=null;
const TABS=[['today','วันนี้'],['cal','ปฏิทิน'],['stu','นักเรียน'],['dash','แดชบอร์ด'],['ai','ถามเอไอ'],['rep','รายงาน PDF'],['set','ตั้งค่า']];
const sorted=a=>[...a].sort((x,y)=>(x.date+x.start).localeCompare(y.date+y.start));

function card(l,full){const s=find('students',l.studentId),u=find('subjects',l.subjectId),p=find('places',l.placeId);
return `<div class="card ${p?p.type:''} ${l.status}"><div class="row"><b>${l.start} น. · ${l.hours} ชม.</b><span class="b ${p?p.type:''}">${p?TL[p.type]+': '+esc(p.name):'—'}</span></div>
<div class="row"><div class="nm" style="display:flex;align-items:center;gap:8px">${s?av(s,30):''}<span>${s?esc(s.name):'(ไม่ระบุนักเรียน)'} <small>${u?esc(u.name):''}</small></span></div><button class="btn" data-a="edit" data-id="${l.id}">แก้ไข</button></div>
<div class="mut">${l.status!='planned'?ST[l.status]+' · ':''}${money(inc(l))}</div>
${full?`<div class="acts">${['done','absent','cancel'].map(k=>`<button class="btn ${k=='done'?'ok':k=='absent'?'bad':'gr'} ${l.status==k?'on':''}" data-a="st" data-id="${l.id}" data-v="${k}">${k=='done'?'✓ ':''}${ST[k]}</button>`).join('')}</div>
<textarea data-a="note" data-id="${l.id}" placeholder="บันทึกการสอนครั้งนี้ เช่น เรื่องที่สอน">${esc(l.note)}</textarea>
<textarea data-a="hw" data-id="${l.id}" placeholder="การบ้านที่มอบหมาย">${esc(l.homework)}</textarea><div class="acts"><button class="btn" data-a="cam" data-id="${l.id}">📷 ถ่ายภาพ</button><button class="btn" data-a="up" data-id="${l.id}">🖼 อัปโหลดรูป</button></div><div class="ph">${phs(l.photos)}</div>`:(l.note?`<div class="mut">📝 ${esc(l.note)}</div>`:'')+(l.homework?`<div class="mut">📚 ${esc(l.homework)}</div>`:'')+`<div class="ph">${phs(l.photos)}</div>`}</div>`}

function vToday(){const t=iso(new Date()),ls=sorted(S.lessons.filter(l=>l.date==t)),h=ls.filter(l=>l.status!='cancel').reduce((a,l)=>a+l.hours,0);
return `<h2>${th(new Date(),{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</h2><div class="mut">${ls.length} คาบ · ${h} ชั่วโมง</div>
${ls.map(l=>card(l,1)).join('')||'<div class="empty">วันนี้ยังไม่มีคาบสอน</div>'}<button class="btn pri" data-a="new" data-d="${t}">+ เพิ่มคาบวันนี้</button>`}

function vWeek(){const s=addD(wk(new Date()),wo*7);let h=`<div class="row"><button class="btn" data-a="wk" data-v="-1">‹</button><b>${th(s,{day:'numeric',month:'short'})} – ${th(addD(s,6),{day:'numeric',month:'short',year:'numeric'})}</b><button class="btn" data-a="wk" data-v="1">›</button></div>`;
for(let i=0;i<7;i++){const d=addD(s,i),k=iso(d),ls=sorted(S.lessons.filter(l=>l.date==k));
h+=`<div class="wd"><b class="${k==iso(new Date())?'t':''}">${th(d,{weekday:'long',day:'numeric',month:'short'})}</b><button class="btn" data-a="new" data-d="${k}">+</button></div>${ls.map(l=>card(l,0)).join('')}`}return h}

function vDash(){const D=S.lessons.filter(l=>l.status=='done'),now=new Date(),w0=iso(wk(now)),m0=iso(now).slice(0,7),y0=String(now.getFullYear());
